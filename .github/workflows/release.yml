name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark GitHub release as pre-release'
        required: false
        type: boolean
        default: true

  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Play Internal & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the whatsnew stale guard

      - name: Extract version & pre-release flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
            IS_PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            IS_PRERELEASE="false"
          fi
          echo "name=$TAG" >> $GITHUB_OUTPUT
          echo "base=${TAG%%-*}" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      # versionCode is bumped by hand; Play rejects a reused one.
      - name: Check versionName matches release version
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
        run: |
          VERSION_NAME=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          if [ "$VERSION_NAME" != "$BASE_VERSION" ]; then
            echo "::error::versionName $VERSION_NAME in app/build.gradle.kts does not match release $BASE_VERSION"
            exit 1
          fi

      - name: Extract Changelog Entry
        id: changelog
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
        run: |
          CHANGELOG_CONTENT=$(awk -v v="$BASE_VERSION" 'index($0, "## [" v "]") == 1 { p = 1; next } /^## \[/ { if (p) exit } p' CHANGELOG.md | sed '/^---/Q' | sed '/^$/d')
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "::error::CHANGELOG.md has no '## [$BASE_VERSION]' section"
            exit 1
          fi
          printf '%s\n' "$CHANGELOG_CONTENT" > "$RUNNER_TEMP/changelog.md"
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_CONTENT" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Check What's New for Play
        run: |
          # whatsnew/whatsnew-<lang-REGION> is written per release from the CHANGELOG section.
          # It must change after the previous stable tag, so old notes never ship again.
          export LC_ALL=C.UTF-8
          if [ ! -s whatsnew/whatsnew-en-US ]; then
            echo "::error::whatsnew/whatsnew-en-US is missing or empty"
            exit 1
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" HEAD -- whatsnew/; then
            echo "::error::whatsnew/ is unchanged since $PREV_TAG; write the notes for this release"
            exit 1
          fi
          echo "whatsnew/ changed since ${PREV_TAG:-<no previous tag>}"
          # Play allows 500 characters per locale; wc -m counts characters in a UTF-8 locale.
          for f in whatsnew/whatsnew-*; do
            n=$(wc -m < "$f")
            echo "--- $f ($n chars) ---"; cat "$f"; echo
            if [ "$n" -gt 500 ]; then echo "::error::$f exceeds 500 chars ($n)"; exit 1; fi
            if [ "$n" -eq 0 ]; then echo "::error::$f is empty"; exit 1; fi
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests & lint
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          # The SHA1 must match the Play upload certificate, or Play rejects the bundle.
          keytool -list -v -keystore app/release.keystore -storepass:env RELEASE_KEYSTORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Build Release APK & AAB
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.baer.handtype
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
